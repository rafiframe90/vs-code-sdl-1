name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code 🐙
      uses: actions/checkout@v4

    - name: Set up MSYS2 & MinGW 🛠️
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-make
          zip
          unzip

    - name: Download and Setup SDL3 🎨
      shell: msys2 {0}
      run: |
        curl -sL https://github.com/libsdl-org/SDL/releases/download/release-3.2.8/SDL3-devel-3.2.8-mingw.zip -o sdl3.zip
        unzip -q sdl3.zip
        mv SDL3-3.2.8/x86_64-w64-mingw32 ./sdl3_dev

    - name: Compile Game ⚙️
      shell: msys2 {0}
      run: |
        # -mwindows removes the extra console window
        g++ -O2 main.cpp -o SurvivalDodge.exe \
            -I./sdl3_dev/include \
            -L./sdl3_dev/lib \
            -lSDL3 -mwindows

    - name: Package with DLL 📦
      shell: msys2 {0}
      run: |
        # Copy the runtime DLL next to the executable
        cp ./sdl3_dev/bin/SDL3.dll ./
        
        # Package into a standard zip archive
        zip SurvivalDodge_Windows.zip SurvivalDodge.exe SDL3.dll

    - name: Upload Build Artifact 🚀
      uses: actions/upload-artifact@v4
      with:
        name: SurvivalDodge-Build
        path: SurvivalDodge_Windows.zip
