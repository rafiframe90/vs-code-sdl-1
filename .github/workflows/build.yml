name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code 🐙
      uses: actions/checkout@v4

    - name: Set up GCC (MinGW) 🛠️
      uses: egor-tisin/setup-mingw@v2

    - name: Download and Setup SDL3 🎨
      shell: bash
      run: |
        curl -sL https://github.com/libsdl-org/SDL/releases/download/release-3.2.8/SDL3-devel-3.2.8-mingw.zip -o sdl3.zip
        unzip -q sdl3.zip
        mv SDL3-3.2.8/x86_64-w64-mingw32 ./sdl3_dev

    - name: Compile Game ⚙️
      shell: bash
      run: |
        # -mwindows removes the extra console window
        g++ -O2 main.cpp -o SurvivalDodge.exe \
            -I./sdl3_dev/include \
            -L./sdl3_dev/lib \
            -lSDL3 -mwindows

    - name: Package with DLL and Encrypt Archive 🔐
      shell: bash
      env:
        ZIP_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
      run: |
        # Copy the runtime DLL next to the executable
        cp ./sdl3_dev/bin/SDL3.dll ./
        
        # Package into password-protected zip
        zip -e -P "$ZIP_PASSWORD" SurvivalDodge_Windows.zip SurvivalDodge.exe SDL3.dll

    - name: Upload Build Artifact 🚀
      uses: actions/upload-artifact@v4
      with:
        name: SurvivalDodge-Build
        path: SurvivalDodge_Windows.zip
